# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.mm.zscmr003
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: s4ood
          url: http://ood:443
          client: '110'
        app:
          name: ZSCMRE003
          description: List of Forecasting Information for KD Table
          package: ZP_M_01
          transport: OODK902333
        exclude:
          - /test/
          - /localService/
